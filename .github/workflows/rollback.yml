name: Roll back backend

on:
  workflow_dispatch:
    inputs:
      image_sha:
        description: Full 40-character commit SHA already published to GHCR
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: backend-production-deploy
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://api.camelbox.com.br/health
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      IMAGE_SHA: ${{ inputs.image_sha }}
    steps:
      - name: Validate requested version
        run: |
          [[ "$IMAGE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/camelbox_deploy
          chmod 600 ~/.ssh/camelbox_deploy
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy selected version
        run: |
          ssh -i ~/.ssh/camelbox_deploy -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" "deploy-backend $IMAGE_SHA"

      - name: Verify public health endpoint
        run: |
          curl --fail --show-error --silent \
            --retry 5 --retry-delay 5 \
            https://api.camelbox.com.br/health
