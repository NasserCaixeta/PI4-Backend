services:
  api:
    image: ghcr.io/nassercaixeta/camelbox-backend:${BACKEND_TAG:?BACKEND_TAG must be set}
    container_name: camelbox-api
    ports:
      - "${API_PORT:-127.0.0.1:8000}:8000"
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-camelbox}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-camelbox}
      PORT: 8000
      REDIS_URL: redis://redis:6379/0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  celery_worker:
    image: ghcr.io/nassercaixeta/camelbox-backend:${BACKEND_TAG:?BACKEND_TAG must be set}
    container_name: camelbox-celery-worker
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-camelbox}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-camelbox}
      REDIS_URL: redis://redis:6379/0
    command:
      - celery
      - -A
      - app.workers.celery_app:celery_app
      - worker
      - --loglevel=info
    restart: unless-stopped

networks:
  default:
    name: camelbox-network
    external: true
