services:
  postgres:
    image: postgres:16-alpine
    container_name: camelbox-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-camelbox}
      POSTGRES_USER: ${POSTGRES_USER:-camelbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-camelbox}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-camelbox} -d ${POSTGRES_DB:-camelbox}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: camelbox-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: camelbox-api
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-camelbox}:${POSTGRES_PASSWORD:-camelbox}@postgres:5432/${POSTGRES_DB:-camelbox}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me-local-docker-secret}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-}
      DATA_ENCRYPTION_KEY_ID: ${DATA_ENCRYPTION_KEY_ID:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-[]}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_SUPER_PRICE_ID: ${STRIPE_SUPER_PRICE_ID:-}
      STRIPE_MASTER_PRICE_ID: ${STRIPE_MASTER_PRICE_ID:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      FREE_ANALYSES_LIMIT: ${FREE_ANALYSES_LIMIT:-3}
      SUPER_ANALYSES_LIMIT: ${SUPER_ANALYSES_LIMIT:-20}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: camelbox-celery-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-camelbox}:${POSTGRES_PASSWORD:-camelbox}@postgres:5432/${POSTGRES_DB:-camelbox}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me-local-docker-secret}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-}
      DATA_ENCRYPTION_KEY_ID: ${DATA_ENCRYPTION_KEY_ID:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-[]}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_SUPER_PRICE_ID: ${STRIPE_SUPER_PRICE_ID:-}
      STRIPE_MASTER_PRICE_ID: ${STRIPE_MASTER_PRICE_ID:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      FREE_ANALYSES_LIMIT: ${FREE_ANALYSES_LIMIT:-3}
      SUPER_ANALYSES_LIMIT: ${SUPER_ANALYSES_LIMIT:-20}
    command:
      - celery
      - -A
      - app.workers.celery_app:celery_app
      - worker
      - --loglevel=info
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: camelbox-network
